# Master Docker Compose orchestrator for the Zero-Trust architecture.
#
# Secrets are NEVER hardcoded here. Values are resolved at runtime from the
# git-crypt-encrypted root .env file (loaded automatically by Compose) or
# the shell environment, e.g.:
#
#     DATABASE_URL          PostgreSQL connection string (Supabase)
#     IDP_RSA_PRIVATE_KEY   IdP signing key, PEM, "\n"-escaped
#
# Gateway, identity, policy, business services, and observability run together.

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "0.0.0.0:${GATEWAY_PORT:-8080}:8080"
    environment:
      JWT_ISSUER: ${IDP_JWT_ISSUER:-http://idp:8080}
      JWT_AUDIENCE: ${IDP_JWT_AUDIENCE:-zerotrust-api-gateway}
      GATEWAY_RATE_LIMIT: ${GATEWAY_RATE_LIMIT:-120}
      GATEWAY_RATE_WINDOW: ${GATEWAY_RATE_WINDOW:-60}
      OTLP_ENDPOINT: http://telemetry:8088/v1/traces
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN}
    volumes:
      - gateway-certs:/certs:ro
    depends_on:
      idp:
        condition: service_healthy
      account-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  policy-engine:
    # Person 3 — OPA Policy Engine. No Dockerfile of our own: the official
    # image runs the server directly and the policies are volume-mounted
    # read-only (policy-as-code lives in ./policy-engine/policies).
    # Version is PINNED (never `latest`) so every teammate evaluates
    # identical Rego with identical semantics.
    image: openpolicyagent/opa:1.20.2
    command:
      - run
      - --server
      - --watch
      # OPA binds to localhost by default — inside a container that would
      # make the service unreachable from the compose network.
      - --addr=0.0.0.0:8181
      - --log-level=info
      - --set=decision_logs.console=true
      # Never load test fixtures into the running decision engine.
      - "--ignore=*_test.rego"
      - /policies
    volumes:
      - ./policy-engine/policies:/policies:ro
    healthcheck:
      # The official image has no shell/curl/wget (distroless-style base),
      # so we don't GET /health like the idp service does. Instead we run a
      # real policy evaluation: `opa eval --fail` exits non-zero when the
      # query is undefined or errors, so this probe goes unhealthy if the
      # mounted policies are missing, fail to compile, or the default-deny
      # decision document no longer resolves to the contract shape
      # (fail-fast, like idp's /readyz).
      test: ['CMD', 'opa', 'eval', '--fail', '-d', '/policies', 'data.authz.allow == {"allow": false}']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  idp:
    build: ./idp
    environment:
      DATABASE_URL: ${DATABASE_URL}
      IDP_RSA_PRIVATE_KEY: ${IDP_RSA_PRIVATE_KEY}
      IDP_JWT_ISSUER: ${IDP_JWT_ISSUER:-http://idp:8080}
      IDP_JWT_AUDIENCE: ${IDP_JWT_AUDIENCE:-zerotrust-api-gateway}
      IDP_JWT_TTL: ${IDP_JWT_TTL:-15m}
      OTLP_ENDPOINT: http://telemetry:8088/v1/traces
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN}
    healthcheck:
      # /readyz pings the database, so the health state reflects whether the
      # IdP can actually serve traffic — downstream services (e.g. the API
      # Gateway) gate startup on this via depends_on: condition: service_healthy.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  #############################################################################
  # Person 4: Microservice A (Account Service)
  # Account balance management, policy enforcement, and atomic deductions.
  #############################################################################
  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POLICY_ENGINE_URL: http://policy-engine:8181/v1/data/authz/allow
      IDP_JWKS_URL: http://idp:8080/.well-known/jwks.json
      JWT_ISSUER: ${IDP_JWT_ISSUER:-http://idp:8080}
      JWT_AUDIENCE: ${IDP_JWT_AUDIENCE:-zerotrust-api-gateway}
      PORT: "8082"
      ENVIRONMENT: ${ACCOUNT_ENVIRONMENT:-production}
      LOG_LEVEL: ${ACCOUNT_LOG_LEVEL:-INFO}
      ACCOUNT_TLS_CERT_FILE: /certs/account-server.crt
      ACCOUNT_TLS_KEY_FILE: /certs/account-server.key
      ACCOUNT_TLS_CA_FILE: /certs/ca.crt
      ACCOUNT_TLS_REQUIRE_CLIENT_CERT: "true"
      OTLP_ENDPOINT: http://telemetry:8088/v1/traces
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN}
    volumes:
      - account-certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/certs/ca.crt", "--cert", "/certs/probe.crt", "--key", "/certs/probe.key", "https://localhost:8082/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      payment-service-certs:
        condition: service_completed_successfully
      idp:
        condition: service_healthy
      policy-engine:
        condition: service_healthy

  #############################################################################
  # Person 6: Observability, Distributed Tracing & Centralized Logging.
  # The audit ingest/read API, the OTLP span receiver and the dashboard.
  #############################################################################
  telemetry:
    build: ./telemetry
    ports:
      - "8088:8088"
    environment:
      # Same shared instance as the IdP, but telemetry owns the audit_events
      # and spans tables exclusively (docs/database.md section 2).
      DATABASE_URL: ${DATABASE_URL}
      # postgres (durable, default) or memory (volatile, demo only).
      TELEMETRY_STORE: ${TELEMETRY_STORE:-postgres}
      # Authenticates collectors, so nobody who reaches the port can forge
      # the security record.
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN}
      TELEMETRY_READ_TOKEN: ${TELEMETRY_READ_TOKEN:-}
      # Mirror received spans to Jaeger so they stay visually browsable.
      TELEMETRY_FORWARD_OTLP_ENDPOINT: ${TELEMETRY_FORWARD_OTLP_ENDPOINT:-http://jaeger:4318}
      TELEMETRY_RETENTION: ${TELEMETRY_RETENTION:-720h}
      TELEMETRY_DASHBOARD_WINDOW: ${TELEMETRY_DASHBOARD_WINDOW:-24h}
      TELEMETRY_LOG_LEVEL: ${TELEMETRY_LOG_LEVEL:-info}
    healthcheck:
      # /readyz pings the audit store, so "healthy" means "can it actually
      # record decisions?" -- which is what the log collector gates on.
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # The service reads its configuration, talks to the database and writes to
    # stdout: it never needs to write to its own filesystem, gain a privilege or
    # hold a capability. An audit trail that can be rewritten by the process
    # keeping it is not much of an audit trail.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Central audit logging consumer: follows every container's stdout in this
  # Compose project and forwards the structured records to the ingest API, so
  # a component becomes auditable by existing rather than by adding a library.
  telemetry-collector:
    build: ./telemetry
    entrypoint: ["/app/shipper"]
    restart: unless-stopped
    environment:
      TELEMETRY_URL: http://telemetry:8088
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN}
      # Empty means "whichever Compose project the collector itself runs in".
      TELEMETRY_SHIP_PROJECT: ${TELEMETRY_SHIP_PROJECT:-}
      TELEMETRY_SHIP_CONTAINERS: ${TELEMETRY_SHIP_CONTAINERS:-}
      # Default excludes the telemetry service itself: shipping the pipeline's
      # own ingest log would feed the collector lines that generate more lines.
      TELEMETRY_SHIP_EXCLUDE: ${TELEMETRY_SHIP_EXCLUDE:-telemetry}
      DOCKER_SOCKET: /var/run/docker.sock
      # The collector's own health, readiness and metrics listener.
      TELEMETRY_SHIP_ADDR: ${TELEMETRY_SHIP_ADDR:-:8089}
      # How much history to read from a container the first time it is followed.
      # "0s" reads everything the container still holds.
      TELEMETRY_SHIP_BACKFILL: ${TELEMETRY_SHIP_BACKFILL:-30m}
      TELEMETRY_LOG_LEVEL: ${TELEMETRY_LOG_LEVEL:-info}
    ports:
      - "${TELEMETRY_SHIP_PORT:-8089}:8089"
    group_add:
      # The collector runs as a non-root user and reads the Docker API socket
      # through the host's docker group. Find the value with:
      #   stat -c '%g' /var/run/docker.sock
      - "${TELEMETRY_DOCKER_GID:-956}"
    volumes:
      # Read-only: the collector inspects containers and follows their logs.
      # It never starts, stops or modifies anything.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The image's inherited HEALTHCHECK probes the telemetry HTTP API, which
    # this service does not serve. It has its own: /readyz reports whether the
    # Docker API is actually reachable, so "unhealthy" means "running but
    # collecting nothing", which is the failure worth being told about.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # On an SELinux host the socket carries the container_var_run_t label, and
    # container_t is denied write on it even as root, so no group or mode fix
    # can help. Relaxing the label for this one container is the contained
    # option (the alternative, `:z`, relabels the socket on the host).
    # Production should front the socket with a read-only proxy instead; this
    # collector only ever calls GET on the container and log endpoints.
    security_opt:
      - label=disable
      # No setuid escalation, and no capabilities at all: reading container
      # stdout and posting JSON needs neither.
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The collector only reads the Docker socket and posts records; it has no
    # state of its own to write.
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      telemetry:
        condition: service_healthy

  # Distributed tracing UI. The telemetry service receives OTLP on the internal
  # network and mirrors the export here, so spans exist once for the audit
  # trace-join and once for visual browsing.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      LOG_LEVEL: warn
    restart: unless-stopped

  # Central log store. Everything a container prints lands here, including the
  # unstructured lines the audit trail deliberately ignores.
  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./telemetry/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  # Ships every container's stdout to Loki using Docker service discovery.
  # This is the "everything" log path; telemetry-collector is the "decisions
  # only" path. Both read the same stdout, so neither can hide a line.
  promtail:
    image: grafana/promtail:3.1.1
    command: -config.file=/etc/promtail/promtail-config.yml -config.expand-env=true
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-dss-project}
    volumes:
      - ./telemetry/observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    # Same SELinux constraint as the audit collector above: the socket and the
    # log files under /var/lib/docker are only reachable with the container
    # label check relaxed.
    security_opt:
      - label=disable
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      # 3300, not Grafana's usual 3000: this stack must come up on a developer
      # machine that is already running something else on 3000. Override with
      # GRAFANA_PORT.
      - "${GRAFANA_PORT:-3300}:3000"
    environment:
      # Anonymous admin is a LOCAL DEVELOPMENT convenience so a reviewer can
      # open Loki without hand-creating an account. Never carry this into a
      # shared or production environment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      JAEGER_BROWSER_URL: http://localhost:${JAEGER_UI_PORT:-16686}
    volumes:
      - ./telemetry/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

  # One-shot development PKI. The authority stays in service-certs; only
  # selected leaf certificates/keys are copied to each runtime's own volume.

  payment-service-certs:
    build: ./payment-service
    # The image's entrypoint is replaced: this container only mints certificates.
    entrypoint: ["sh", "/app/provision-certs.sh"]
    # Root owns provisioning; runtime keys are copied with mode 0600 and
    # assigned to UID 1001. This is the only service with filesystem capabilities.
    user: "0:0"
    volumes:
      - service-certs:/authority
      - payment-certs:/payment
      - account-certs:/account
      - gateway-certs:/gateway
    # Nothing to restart: it either minted the bundle and exited 0, or it failed
    # and the service below must not start (private keys that do not exist are
    # not a configuration a payment service should improvise around).
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE

  payment-service:
    build: ./payment-service
    user: "1001:1001"
    environment:
      # The ledger. This service owns `transactions` and no other table
      # (docs/database.md §2); its migration bookkeeping is namespaced so it
      # cannot collide with another service's on the shared instance.
      DATABASE_URL: ${DATABASE_URL}
      PAYMENT_STORE: ${PAYMENT_STORE:-postgres}
      PAYMENT_SERVICE_NAME: payment-service
      PAYMENT_LOG_LEVEL: ${PAYMENT_LOG_LEVEL:-info}

      # --- Transport Contract: mTLS on every connection -------------------
      PAYMENT_TLS_CERT_FILE: /certs/payment-service.crt
      PAYMENT_TLS_KEY_FILE: /certs/payment-service.key
      PAYMENT_TLS_CA_FILE: /certs/ca.crt
      PAYMENT_TLS_REQUIRE_CLIENT_CERT: ${PAYMENT_TLS_REQUIRE_CLIENT_CERT:-true}
      # Who may move money. The `probe` certificate used by the health check is
      # deliberately not listed: it can ask whether the service is alive, and
      # cannot call /transfer.
      PAYMENT_ALLOWED_CLIENT_IDS: ${PAYMENT_ALLOWED_CLIENT_IDS:-gateway,account-service}

      # --- Person 1: verify the token again, at this boundary -------------
      PAYMENT_JWKS_URL: ${PAYMENT_JWKS_URL:-http://idp:8080/.well-known/jwks.json}
      PAYMENT_JWT_ISSUER: ${IDP_JWT_ISSUER:-http://idp:8080}
      PAYMENT_JWT_AUDIENCE: ${IDP_JWT_AUDIENCE:-zerotrust-api-gateway}

      # --- Person 3: the authorization decision ---------------------------
      # http is the endpoint docs/policymaker.md specifies; the engine gains a
      # TLS listener as deferred hardening on Person 3's side.
      PAYMENT_POLICY_URL: ${PAYMENT_POLICY_URL:-http://policy-engine:8181/v1/data/authz/allow}

      # --- Person 4: the only component that owns the balances ------------
      # https and mutual TLS by default (this service presents
      # payment-service-client.crt). Person 4's service must mount this volume
      # and trust the same CA to accept the call.
      PAYMENT_ACCOUNT_SERVICE_URL: ${PAYMENT_ACCOUNT_SERVICE_URL:-https://account-service:8082}
      PAYMENT_UPSTREAM_TLS_CERT_FILE: /certs/payment-service-client.crt
      PAYMENT_UPSTREAM_TLS_KEY_FILE: /certs/payment-service-client.key
      PAYMENT_UPSTREAM_TLS_CA_FILE: /certs/ca.crt
      PAYMENT_ALLOW_INSECURE_UPSTREAM: ${PAYMENT_ALLOW_INSECURE_UPSTREAM:-false}

      # --- Person 6: spans; audit decisions go to stdout regardless --------
      PAYMENT_OTLP_ENDPOINT: ${PAYMENT_OTLP_ENDPOINT:-http://telemetry:8088/v1/traces}
      PAYMENT_OTLP_TOKEN: ${TELEMETRY_INGEST_TOKEN:-}
    volumes:
      # Read-only runtime identity; the authority key is not mounted.
      - payment-certs:/certs:ro
    depends_on:
      payment-service-certs:
        condition: service_completed_successfully
      # The Policy Engine is on the request path for every transfer, so it is
      # worth gating startup on it. The IdP is not gated: the key set is fetched
      # lazily (and the first fetch is retried), so this service can start
      # before the IdP is healthy and reports readiness honestly either way.
      policy-engine:
        condition: service_healthy
    healthcheck:
      # The listener refuses a peer without a client certificate, so the probe
      # has to be able to present one — busybox `wget` cannot, which is why the
      # image's own binary performs this check.
      test:
        - CMD
        - /app/payment-server
        - healthcheck
        - --url
        - https://localhost:8081/healthz
        - --ca
        - /certs/ca.crt
        - --cert
        - /certs/probe.crt
        - --key
        - /certs/probe.key
        - --server-name
        - localhost
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # The service reads its configuration, talks to its dependencies and writes
    # to stdout. It never needs to write to its own filesystem, gain a privilege
    # or hold a capability — and a payment service that can rewrite its own
    # binary is one an attacker does not have to attack.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  default:
    # The Supabase host resolves only to IPv6 on this deployment (no A
    # record). Docker's default bridge is IPv4-only, so enable IPv6 on the
    # bridge to give containers a working path to the database. AAAA-first
    # resolution with no IPv6 route otherwise fails hard with "network is
    # unreachable" and Go never falls back.
    enable_ipv6: ${DSS_IPV6_ENABLED:-true}

volumes:
  service-certs:
  payment-certs:
  account-certs:
  gateway-certs:
  # Loki's chunk/index store and Grafana's state. Named volumes so
  # `docker compose down` does not throw away the logs a reviewer is reading.
  loki-data:
  grafana-data:
