# Grafana datasource provisioning.
#
# Grafana exists here for one job: ad-hoc log exploration over Loki. The audit
# dashboard (counts, denials, traces) is served by the telemetry service
# itself at /dashboard, so this container has no dashboards to provision and
# nothing to configure by hand after startup.

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    # Fixed uid, so a saved Explore URL or a shared link keeps working.
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
      # Let Explore pivot from a log line to the distributed trace it belongs
      # to, using the trace id the components already propagate in the
      # traceparent header (docs/flow.md §3). This is an external link: it
      # points the browser at Jaeger's UI rather than requiring a Grafana
      # datasource plugin.
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceparent"\s*:\s*"[0-9a-f]{2}-([0-9a-f]{32})'
          url: 'http://localhost:16686/trace/$${__value.raw}'
