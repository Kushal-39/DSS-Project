# Grafana datasource provisioning.
#
# Grafana exists here for one job: reading the centralized log store (Loki).
# The audit dashboard (counts, denials, traces) is served by the telemetry
# service itself at /dashboard, because those numbers come from PostgreSQL and
# not from the log store — so Grafana is not the audit UI and must not become
# one. The log views it does own are provisioned as files alongside this one:
# see ../dashboards/dashboards.yml, and nothing here has to be configured by
# hand after startup.

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    # Fixed uid, so a saved Explore URL or a shared link keeps working.
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
      # Let Explore pivot from a log line to the distributed trace it belongs
      # to, using the trace id the components already propagate in the
      # traceparent header (docs/flow.md §3). This is an external link: it
      # points the browser at Jaeger's UI rather than requiring a Grafana
      # datasource plugin.
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceparent"\s*:\s*"[0-9a-f]{2}-([0-9a-f]{32})'
          url: '${JAEGER_BROWSER_URL}/trace/$${__value.raw}'
