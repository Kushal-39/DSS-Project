# Promtail configuration — ships every container's stdout to Loki.
#
# Promtail uses Docker service discovery to find containers, then reads their
# log files. It is the "everything" log path; the audit pipeline
# (telemetry/cmd/shipper) is the "decisions only" path. Both read the same
# stdout, so neither can hide a line from the other.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  # Committed read offsets, so a restart resumes instead of re-shipping.
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5s
      max_retries: 10
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    # Only the meta labels this Promtail version actually publishes are used.
    # Docker SD provides __meta_docker_container_id, _name and the container's
    # own labels; it does NOT provide _state, _image or _log_stream. Referencing
    # a meta label that does not exist is silent: the rule simply matches
    # nothing, the stream ends up with no labels at all, and Loki rejects every
    # batch with "at least one label pair is required per stream".
    relabel_configs:
      # Scope: this project's containers only.
      #
      # Without this rule, docker_sd discovers every container on the host —
      # including whatever else a developer happens to be running — and ships
      # the machine's whole log output into this project's Loki. Compose derives
      # the project name from the checkout directory (DSS-Project ->
      # dss-project), which is why that is the default; change the regex if you
      # override COMPOSE_PROJECT_NAME, and keep it in step with
      # TELEMETRY_SHIP_PROJECT so both log paths cover the same containers.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: '${COMPOSE_PROJECT_NAME}'
        action: keep
      # __meta_docker_container_name arrives with a leading slash.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Compose labels turn container names into queryable service names:
      # {service="idp"} is what a teammate actually wants to type.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: project
      # Guarantee a label even for a container Compose did not start, so a
      # stream can never be label-less.
      - target_label: job
        replacement: docker
    pipeline_stages:
      # Structured JSON logs are the project standard (docs/flow.md §6), so
      # lift the level and the event name into labels for cheap filtering.
      # Non-JSON lines fall through untouched: they still land in Loki.
      - json:
          expressions:
            level: level
            event: msg
            service_name: service
          drop_malformed: false
      - labels:
          level:
          event:
    # Note: `service` is a genuine label (set from the Compose label above)
    # because it is low-cardinality and every query filters on it. `event` is
    # bounded by the number of event names the code emits. Nothing else is
    # promoted — a request path or a user id as a label would blow up the
    # index, which is the classic Loki failure mode.
